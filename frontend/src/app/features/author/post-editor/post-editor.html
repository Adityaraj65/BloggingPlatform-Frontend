<div class="min-h-[calc(100vh-4rem)] py-8 px-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-2">{{ isEditMode ? 'Edit Post' : 'Create New Post' }}</h1>
      <p class="text-secondary">Share your thoughts with the community</p>
    </div>

    <!-- Error Message -->
    @if (error) {
      <div class="bg-danger/10 border border-danger/20 text-danger p-4 rounded-md mb-6">
        {{ error }}
      </div>
    }

    <!-- Form -->
    <form class="space-y-6" (ngSubmit)="onSubmit()">
      <!-- Title -->
      <div class="form-group">
        <label for="title" class="form-label block text-sm font-medium mb-2">Title</label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          [(ngModel)]="post.title" 
          placeholder="Enter a compelling title"
          class="form-input w-full"
          required
          minlength="5"
          maxlength="200"
        >
        <p class="text-xs text-muted mt-1">Must be between 5 and 200 characters</p>
      </div>

      <!-- Excerpt -->
      <div class="form-group">
        <label for="excerpt" class="form-label block text-sm font-medium mb-2">Excerpt</label>
        <textarea 
          id="excerpt" 
          name="excerpt" 
          [(ngModel)]="post.excerpt" 
          placeholder="Brief description of your post (optional)"
          class="form-input w-full"
          rows="3"
          maxlength="500"
        ></textarea>
        <p class="text-xs text-muted mt-1">Maximum 500 characters</p>
      </div>

      <!-- Content -->
      <div class="form-group">
        <label for="content" class="form-label block text-sm font-medium mb-2">Content</label>
        <textarea 
          id="content" 
          name="content" 
          [(ngModel)]="post.content" 
          placeholder="Write your post content here..."
          class="form-input w-full"
          rows="15"
          required
          minlength="50"
        ></textarea>
        <p class="text-xs text-muted mt-1">Must be at least 50 characters</p>
      </div>

      <!-- Featured Image URL -->
      <div class="form-group">
        <label class="form-label block text-sm font-medium mb-2">Featured Image</label>
        <div class="flex flex-col gap-3">
          <div class="flex gap-4 items-center">
            <input 
              type="url" 
              id="featuredImageUrl" 
              name="featuredImageUrl" 
              [(ngModel)]="post.featuredImageUrl" 
              placeholder="https://example.com/image.jpg"
              class="form-input flex-1"
            >
            <span class="text-secondary text-sm font-medium">OR</span>
            <label class="btn btn-outline cursor-pointer relative" [class.opacity-50]="uploadingImage">
              {{ uploadingImage ? 'Uploading...' : 'Upload Image' }}
              <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" [disabled]="uploadingImage">
            </label>
          </div>
          @if (post.featuredImageUrl) {
            <div class="relative w-32 h-20 rounded overflow-hidden border border-primary/20">
              <img [src]="post.featuredImageUrl" class="w-full h-full object-cover">
            </div>
          }
        </div>
        <p class="text-xs text-muted mt-1">Optional: Provide an image URL or upload a file</p>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="categoryId" class="form-label block text-sm font-medium mb-2">Category</label>
        <select 
          id="categoryId" 
          name="categoryId" 
          [(ngModel)]="post.categoryId" 
          class="form-input w-full"
        >
          <option [ngValue]="null">Select a category (optional)</option>
          @for (category of categories; track category.categoryId) {
            <option [ngValue]="category.categoryId">{{ category.name }}</option>
          }
        </select>
      </div>

      <!-- Actions -->
      <div class="flex gap-4 pt-6">
        <button 
          type="submit" 
          class="btn btn-primary flex-1"
          [disabled]="saving || loading"
        >
          {{ saving ? 'Saving...' : (isEditMode ? 'Update Post' : 'Publish Post') }}
        </button>
        
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="router.navigate(['/author/dashboard'])"
          [disabled]="saving"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
