<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      IW
    </div>

    <h1 class="auth-title">
      Welcome Back
    </h1>

    <p class="auth-subtitle">
      Sign in to continue your InkWell journey
    </p>

    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

     <div
  class="auth-error"
  *ngIf="error"
>
  {{ error }}
</div>

      <!-- IDENTIFIER -->

      <div>

        <label class="auth-label">
          Email or Username
        </label>

        <input
          type="text"
          name="identifier"
          [(ngModel)]="credentials.identifier"
          placeholder="Enter email or username"
          class="auth-input"
          required
        >

      </div>

      <!-- PASSWORD -->

      <div>

        <div class="flex justify-between items-center mb-2">

          <label class="auth-label !mb-0">
            Password
          </label>

        </div>

        <input
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Enter password"
          class="auth-input"
          required
        >

      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="auth-button"
      >

        {{
          loading
          ? 'Signing in...'
          : 'Sign In'
        }}

      </button>

    </form>

    <p class="auth-footer">

      Don't have an account?

      <a routerLink="/register">
        Sign up
      </a>

    </p>

  </div>

</div>
