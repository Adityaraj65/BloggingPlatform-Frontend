<div class="auth-container animate-fade-in flex items-center justify-center min-h-[calc(100vh-4rem)] py-12">
  <div class="auth-card card max-w-md w-full">
    <div class="text-center mb-8">
      <div class="auth-logo mx-auto mb-4"></div>
      <h2 class="text-3xl m-0">Welcome back</h2>
      <p class="text-secondary mt-2">Sign in to your InkWell account</p>
    </div>
    
    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()">
      @if (error) {
        <div class="text-sm text-white bg-danger p-4 rounded-lg border border-danger/50 font-medium shadow-md">
          <div class="flex items-start gap-2">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
            <span>{{ error }}</span>
          </div>
        </div>
      }
      <div class="form-group">
        <label for="identifier" class="form-label block text-sm font-medium mb-1">Email or Username</label>
        <input type="text" id="identifier" name="identifier" [(ngModel)]="credentials.identifier" placeholder="you@example.com" class="form-input" required>
      </div>
      
      <div class="form-group">
        <div class="flex justify-between items-center mb-1">
          <label for="password" class="form-label text-sm font-medium">Password</label>
          <a href="#" class="text-sm text-primary">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" placeholder="••••••••" class="form-input" required>
      </div>
      
      <button type="submit" class="btn btn-primary w-full mt-4" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
    
    <div class="auth-divider flex items-center justify-center my-6">
      <span class="text-sm text-muted bg-surface px-2">Or continue with</span>
    </div>
    
    <div class="oauth-buttons flex gap-4">
      <button class="btn btn-secondary flex-1 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27c3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10c5.35 0 9.25-3.67 9.25-9.09c0-1.15-.15-1.81-.15-1.81Z"/></svg>
        Google
      </button>
      <button class="btn btn-secondary flex-1 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34c-.46-1.16-1.11-1.47-1.11-1.47c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.87 1.52 2.34 1.07 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33c.85 0 1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z"/></svg>
        GitHub
      </button>
    </div>
    
    <p class="text-center text-sm text-secondary mt-8">
      Don't have an account? <a routerLink="/register" class="text-primary font-medium">Sign up</a>
    </p>
  </div>
</div>
