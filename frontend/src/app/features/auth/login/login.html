<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      IW
    </div>

    <h1 class="auth-title">
      Welcome Back
    </h1>

    <p class="auth-subtitle">
      Sign in to continue your InkWell journey
    </p>

    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

  <div class="auth-error" *ngIf="error">
    {{ error }}
    <div *ngIf="error === 'Email not verified'" class="mt-2">
      <button type="button" (click)="resendVerification()" class="primary-btn" style="font-size: 0.8rem; padding: 0.2rem 0.5rem;">
        Resend Verification Email
      </button>
    </div>
  </div>
  
  <div class="auth-success" *ngIf="message" style="color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(16, 185, 129, 0.2);">
    {{ message }}
  </div>

      <!-- IDENTIFIER -->

      <div>

        <label class="auth-label">
          Email or Username
        </label>

        <input
          type="text"
          name="identifier"
          [(ngModel)]="credentials.identifier"
          placeholder="Enter email or username"
          class="auth-input"
          required
        >

      </div>

      <!-- PASSWORD -->

      <div>

        <div class="flex justify-between items-center mb-2" style="display: flex; justify-content: space-between;">

          <label class="auth-label !mb-0">
            Password
          </label>
          
          <a routerLink="/forgot-password" style="font-size: 0.85rem; color: #3b82f6; text-decoration: none;">Forgot Password?</a>

        </div>

        <input
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Enter password"
          class="auth-input"
          required
        >

      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="auth-button"
      >

        {{
          loading
          ? 'Signing in...'
          : 'Sign In'
        }}

      </button>

    </form>

    <!-- OAuth Divider -->
    <div class="oauth-divider">
      <span>OR</span>
    </div>

    <!-- Google OAuth Button -->
    <button
      type="button"
      (click)="loginWithGoogle()"
      class="oauth-button google-button"
      title="Sign in with Google"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.6 9.2l-.1-1.8H9v3.4h4.9c-.2 1.3-.9 2.4-1.9 3.1v2.5h3.1c1.8-1.6 2.8-4 2.8-6.2z" fill="#4285F4"/>
        <path d="M9 18c2.4 0 4.5-.8 6-2.2l-3.1-2.5c-.8.6-1.9 1-2.9 1-2.2 0-4.1-1.5-4.8-3.5H1.7v2.6C3.2 16.3 5.9 18 9 18z" fill="#34A853"/>
        <path d="M4.2 10.8c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V3.2H1.7C1.1 4.6.8 6.2.8 9s.3 4.4.9 5.8l2.5-2z" fill="#FBBC04"/>
        <path d="M9 3.5c1.3 0 2.5.4 3.4 1.3l2.6-2.6C13.5.9 11.4 0 9 0 5.9 0 3.2 1.7 1.7 4.2l2.5 2.1c.7-2 2.6-3.5 4.8-3.5z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-footer">

      Don't have an account?

      <a routerLink="/register">
        Sign up
      </a>

    </p>

  </div>

</div>
