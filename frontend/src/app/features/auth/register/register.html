<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full glass p-8 rounded-2xl shadow-2xl animate-fade-in relative overflow-hidden">
    <!-- Decorative glow -->
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-secondary/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="auth-logo mx-auto mb-4 flex items-center justify-center text-white font-bold text-2xl">
        IW
      </div>
      <h2 class="text-3xl font-bold">Join InkWell</h2>
      <p class="text-secondary mt-2">Start your publishing journey today</p>
    </div>
    
    <form class="flex flex-col gap-4 relative z-10" (ngSubmit)="onSubmit()">
      @if (error) {
        <div class="text-sm text-white bg-danger p-4 rounded-lg border border-danger/50 font-medium shadow-md">
          <div class="flex items-start gap-2">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
            <span>{{ error }}</span>
          </div>
        </div>
      }
      <div class="form-group">
        <label for="fullName" class="form-label block text-sm font-medium mb-1">Full Name</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="userData.fullName" placeholder="Jane Doe" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="username" class="form-label block text-sm font-medium mb-1">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="userData.username" placeholder="janedoe" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="userData.email" placeholder="you@example.com" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="userData.password" placeholder="••••••••" class="form-input" required minlength="6">
        <p class="text-xs text-muted mt-1">Must be at least 6 characters</p>
      </div>
      
      <div class="form-group">
        <label for="role" class="form-label block text-sm font-medium mb-1">Role</label>
        <select id="role" name="role" [(ngModel)]="userData.role" class="form-input" required>
          <option value="READER">Reader - Browse and read content</option>
          <option value="AUTHOR" selected>Author - Create and publish posts</option>
          <option value="ADMIN">Admin - Full system access</option>
        </select>
        <p class="text-xs text-muted mt-1">Choose your role in the platform</p>
      </div>
      
      <button type="submit" class="btn btn-primary w-full mt-4" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>
    
    <div class="auth-divider flex items-center justify-center my-6 relative z-10">
      <span class="px-3 text-sm text-muted">Or continue with</span>
    </div>
    
    <div class="grid grid-cols-2 gap-4 relative z-10">
      <button class="btn glass flex items-center justify-center gap-2 py-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="btn glass flex items-center justify-center gap-2 py-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        GitHub
      </button>
    </div>
    
    <p class="text-center text-secondary text-sm mt-8 relative z-10">
      Already have an account? <a routerLink="/login" class="text-primary hover:underline">Sign in</a>
    </p>
  </div>
</div>
