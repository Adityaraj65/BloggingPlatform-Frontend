<div class="auth-page">

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      IW
    </div>

    <!-- Header -->
    <h1 class="auth-title">
      Join InkWell
    </h1>

    <p class="auth-subtitle">
      Create your account and start publishing
    </p>

    <!-- Form -->
    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

      <!-- Error -->
      @if (error) {
        <div class="auth-error">
          {{ error }}
        </div>
      }

      <!-- Full Name -->
      <div>

        <label class="auth-label">
          Full Name
        </label>

        <input
          type="text"
          name="fullName"
          [(ngModel)]="userData.fullName"
          placeholder="John Doe"
          class="auth-input"
          required
        >
      </div>

      <!-- Username -->
      <div>

        <label class="auth-label">
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="userData.username"
          placeholder="john"
          class="auth-input"
          required
        >
      </div>

      <!-- Email -->
      <div>

        <label class="auth-label">
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="userData.email"
          placeholder="you@example.com"
          class="auth-input"
          required
        >
      </div>

      <!-- Password -->
      <div>

        <label class="auth-label">
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="userData.password"
          placeholder="Create a password"
          class="auth-input"
          required
        >

        <p class="text-xs text-gray-500 mt-2">
          Must be at least 6 characters
        </p>

      </div>

      <!-- Role -->
      <div>

        <label class="auth-label">
          Role
        </label>

        <select
          name="role"
          [(ngModel)]="userData.role"
          class="auth-input auth-select"
        >

          <option value="READER">
            Reader
          </option>

          <option value="AUTHOR">
            Author
          </option>

          <option value="ADMIN">
            Admin
          </option>

        </select>

      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="auth-button"
      >

        {{ loading ? 'Creating account...' : 'Create Account' }}

      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider">
      <span>OR</span>
    </div>

    <!-- Google OAuth Button -->
    <button
      type="button"
      (click)="loginWithGoogle()"
      class="oauth-button google-button"
      title="Sign up with Google"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.6 9.2l-.1-1.8H9v3.4h4.9c-.2 1.3-.9 2.4-1.9 3.1v2.5h3.1c1.8-1.6 2.8-4 2.8-6.2z" fill="#4285F4"/>
        <path d="M9 18c2.4 0 4.5-.8 6-2.2l-3.1-2.5c-.8.6-1.9 1-2.9 1-2.2 0-4.1-1.5-4.8-3.5H1.7v2.6C3.2 16.3 5.9 18 9 18z" fill="#34A853"/>
        <path d="M4.2 10.8c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V3.2H1.7C1.1 4.6.8 6.2.8 9s.3 4.4.9 5.8l2.5-2z" fill="#FBBC04"/>
        <path d="M9 3.5c1.3 0 2.5.4 3.4 1.3l2.6-2.6C13.5.9 11.4 0 9 0 5.9 0 3.2 1.7 1.7 4.2l2.5 2.1c.7-2 2.6-3.5 4.8-3.5z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Footer -->
    <p class="auth-footer">

      Already have an account?

      <a routerLink="/login">
        Sign in
      </a>

    </p>

  </div>

</div>
