<div class="auth-page">

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      IW
    </div>

    <!-- Header -->
    <h1 class="auth-title">
      Join InkWell
    </h1>

    <p class="auth-subtitle">
      Create your account and start publishing
    </p>

    <!-- Form -->
    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

      <!-- Error -->
      @if (error) {
        <div class="auth-error">
          {{ error }}
        </div>
      }

      <!-- Full Name -->
      <div>

        <label class="auth-label">
          Full Name
        </label>

        <input
          type="text"
          name="fullName"
          [(ngModel)]="userData.fullName"
          placeholder="John Doe"
          class="auth-input"
          required
        >
      </div>

      <!-- Username -->
      <div>

        <label class="auth-label">
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="userData.username"
          placeholder="john"
          class="auth-input"
          required
        >
      </div>

      <!-- Email -->
      <div>

        <label class="auth-label">
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="userData.email"
          placeholder="you@example.com"
          class="auth-input"
          required
        >
      </div>

      <!-- Password -->
      <div>

        <label class="auth-label">
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="userData.password"
          placeholder="Create a password"
          class="auth-input"
          required
        >

        <p class="text-xs text-gray-500 mt-2">
          Must be at least 6 characters
        </p>

      </div>

      <!-- Role -->
      <div>

        <label class="auth-label">
          Role
        </label>

        <select
          name="role"
          [(ngModel)]="userData.role"
          class="auth-input auth-select"
        >

          <option value="READER">
            Reader
          </option>

          <option value="AUTHOR">
            Author
          </option>

          <option value="ADMIN">
            Admin
          </option>

        </select>

      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="auth-button"
      >

        {{ loading ? 'Creating account...' : 'Create Account' }}

      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider">
      <span>Or continue with</span>
    </div>

    <!-- Social -->
    <div class="social-grid">

      <button class="social-button">
        Google
      </button>

      <button class="social-button">
        GitHub
      </button>

    </div>

    <!-- Footer -->
    <p class="auth-footer">

      Already have an account?

      <a routerLink="/login">
        Sign in
      </a>

    </p>

  </div>

</div>
